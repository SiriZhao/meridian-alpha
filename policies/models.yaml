example_defaults: true
tradingagents_provider: legacy-disabled
tradingagents_model: legacy-disabled
timeout_seconds: 30
retry_budget: 1
debate_rounds: 1
allocator_selection: finrlx
research:
  provider: codex_cli
  model: gpt-5.6-luna
  quick_model: gpt-5.6-luna
  deep_model: gpt-5.6-luna
  thinking_mode: medium
  reasoning_effort: low
  # One shared Codex process covers the complete structured chain. The prior
  # 60s deadline cancelled a slow host invocation before output collection.
  timeout_seconds: 180
  max_retries: 1
  llm_max_retries: 1
  graph_max_retries: 0
  max_graph_wall_time_seconds: 900
  live_as_of_tolerance_seconds: 86400
  debate_rounds: 0
  max_parallel_tickers: 2
  live_enabled: false
  minimum_research_coverage: 1.0
  research_engine: gpt_native_v1
  primary_model: gpt-5.6-luna
  skeptic_model: gpt-5.6-luna
  scenario_model: gpt-5.6-luna
  synthesis_model: gpt-5.6-luna
  models:
    PRIMARY_ANALYST:
      model: gpt-5.6-luna
      reasoning_effort: low
      timeout_seconds: 16
      max_attempts: 1
    SKEPTIC:
      model: gpt-5.6-luna
      reasoning_effort: low
      timeout_seconds: 10
      max_attempts: 1
    SCENARIO_ANALYST:
      model: gpt-5.6-luna
      reasoning_effort: low
      timeout_seconds: 8
      max_attempts: 1
    DECISION_SYNTHESIZER:
      model: gpt-5.6-luna
      reasoning_effort: low
      timeout_seconds: 8
      max_attempts: 1
  native_budget:
    # One bounded Codex process performs all four logical roles. This budget
    # covers one cold start plus structured synthesis; it is not four retries.
    # gpt-5.6-luna/low was live-validated at <36s on the canonical packet.
    total_seconds: 180
    cleanup_seconds: 2
    primary_seconds: 16
    skeptic_seconds: 10
    scenario_seconds: 8
    synthesis_seconds: 8
  budget:
    max_graph_tickers_per_run: 3
    max_parallel_graphs: 1
    max_graph_age_hours: 24
    always_review_existing_holdings: true
    candidate_selection_mode: existing_then_order
    minimum_quant_score: -1
    existing_holding_review_policy: always
