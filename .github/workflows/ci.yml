name: Meridian Alpha CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create project environment
        shell: bash
        run: python -m venv .venv
      - name: Install project
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON_BIN=".venv/Scripts/python.exe"; else PYTHON_BIN=".venv/bin/python"; fi
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -e ".[dev]"
      - name: Repository validation
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON_BIN=".venv/Scripts/python.exe"; else PYTHON_BIN=".venv/bin/python"; fi
          "$PYTHON_BIN" scripts/validate_repo.py
      - name: Manual authority negative tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON_BIN=".venv/Scripts/python.exe"; else PYTHON_BIN=".venv/bin/python"; fi
          "$PYTHON_BIN" -m pytest tests/test_gate6f_manual_authority.py -q
      - name: Replay integrity tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON_BIN=".venv/Scripts/python.exe"; else PYTHON_BIN=".venv/bin/python"; fi
          "$PYTHON_BIN" -m pytest tests/test_gate5e_5f_integrity.py -q
      - name: Validate Skill package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON_BIN=".venv/Scripts/python.exe"; else PYTHON_BIN=".venv/bin/python"; fi
          "$PYTHON_BIN" skills/meridian-alpha/scripts/validate_package.py skills/meridian-alpha
      - name: Scan high-risk credential patterns
        shell: bash
        run: |
          set -eu
          if rg -n --hidden -g '!.git/**' -g '!.venv/**' -g '!runs/**' -g '!var/**' -g '!*.lock' \
            '(api[_-]?key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{12,}|access[_-]?token[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{12,}|authorization[[:space:]]*[:=][[:space:]]*bearer[[:space:]]+[A-Za-z0-9._-]+|\bsk-[A-Za-z0-9]{12,})' .; then
            echo "High-risk credential pattern detected"
            exit 1
          fi
