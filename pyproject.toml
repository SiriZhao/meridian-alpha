[project]
name = "meridian-alpha"
version = "0.0.0"
description = "AI-assisted, deterministic portfolio decision support for manual US-equity limit orders"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tzdata>=2025.1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "mcp[cli]>=1.24,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyright>=1.1.390",
  "ruff>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyright>=1.1.390",
  "ruff>=0.9,<1",
]

[project.scripts]
meridian = "meridian.application_cli:main"
meridian-mcp = "meridian.mcp_server:main"
meridian-mcp-http = "meridian.mcp_server:http_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "meridian/policies"
"prompts/codex_research_v1.md" = "meridian/prompts/codex_research_v1.md"
"prompts/codex_data_gap_planner_v1.md" = "meridian/prompts/codex_data_gap_planner_v1.md"
"prompts/codex_web_research_v1.md" = "meridian/prompts/codex_web_research_v1.md"
"schemas/codex_research_response.schema.json" = "meridian/schemas/codex_research_response.schema.json"
"schemas/meridian-canonical-run.v1.schema.json" = "meridian/schemas/meridian-canonical-run.v1.schema.json"
"schemas/meridian-paper-daily.v1.schema.json" = "meridian/schemas/meridian-paper-daily.v1.schema.json"
"schemas/meridian-run-health.v1.schema.json" = "meridian/schemas/meridian-run-health.v1.schema.json"
"schemas/quant-v2-policy.schema.json" = "meridian/schemas/quant-v2-policy.schema.json"
"schemas/quant-v2-features.schema.json" = "meridian/schemas/quant-v2-features.schema.json"
"schemas/quant-v2-dataset.schema.json" = "meridian/schemas/quant-v2-dataset.schema.json"
"schemas/quant-v2-experiment-plan.schema.json" = "meridian/schemas/quant-v2-experiment-plan.schema.json"
"schemas/quant-shadow-comparison.v1.schema.json" = "meridian/schemas/quant-shadow-comparison.v1.schema.json"
"skills/meridian-alpha/SKILL.md" = "meridian/skills/meridian-alpha/SKILL.md"
"skills/meridian-alpha/fixtures/test-account.json" = "meridian/skills/meridian-alpha/fixtures/test-account.json"
"skills/meridian-alpha/references/account-contract.md" = "meridian/skills/meridian-alpha/references/account-contract.md"
"skills/meridian-alpha/references/order-ticket.md" = "meridian/skills/meridian-alpha/references/order-ticket.md"
"skills/meridian-alpha/references/runtime-dependencies.md" = "meridian/skills/meridian-alpha/references/runtime-dependencies.md"
"skills/meridian-alpha/references/safety.md" = "meridian/skills/meridian-alpha/references/safety.md"
"skills/meridian-alpha/references/workflow.md" = "meridian/skills/meridian-alpha/references/workflow.md"
"skills/meridian-alpha/scripts/preflight.py" = "meridian/skills/meridian-alpha/scripts/preflight.py"
"skills/meridian-alpha/scripts/run_daily.py" = "meridian/skills/meridian-alpha/scripts/run_daily.py"
"skills/meridian-alpha/scripts/validate_package.py" = "meridian/skills/meridian-alpha/scripts/validate_package.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src/meridian/alpha_lab.py", "src/meridian/dated_close.py", "src/meridian/lab_evaluation.py", "src/meridian/portfolio_lab.py"]
reportMissingTypeStubs = "none"
venvPath = '.'
venv = '.venv'
